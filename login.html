<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Iniciar sesión | IEDP Talca</title>
  <meta name="description" content="Accede a tu cuenta de la Iglesia Evangélica de Dios Pentecostal de Talca para consultar y descargar los documentos de la congregación.">
  <meta name="robots" content="noindex">

  <link rel="icon" href="imagenes/logo-sin.fondo.png">
  <link rel="apple-touch-icon" href="imagenes/iconos/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#060d21">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>

<body>

  <div id="navbar"></div>

  <main>
    <section class="auth-seccion">
      <div class="auth-caja">

        <h1 class="auth-titulo">Iniciar sesión</h1>
        <p class="auth-bajada">Accede para ver y descargar los documentos de la congregación.</p>

        <div id="mensaje" hidden role="alert"></div>

        <form data-form-auth="login" novalidate>

          <div class="campo">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
              placeholder="tucorreo@ejemplo.com"
            >
          </div>

          <div class="campo">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="btn-principal">Entrar</button>

        </form>

        <p class="auth-pie">
          ¿No tienes cuenta?
          <a href="register.html">Regístrate aquí</a>
        </p>

      </div>
    </section>
  </main>

  <!-- PIE (COMPONENTE) -->

  <div id="pie"></div>


  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/pie.js"></script>
  <script src="js/auth-formularios.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
